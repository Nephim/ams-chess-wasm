<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TouchGFX Chess — High-DPI WebAssembly</title>
  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --border-color: #30363d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --accent: #58a6ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 20%, #1c2433 0%, var(--bg-primary) 75%);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(94vw, calc((84vh - 60px) * (480 / 272)));
      max-width: 1440px;
      margin-bottom: 12px;
      padding: 8px 16px;
      background: rgba(22, 27, 34, 0.85);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      backdrop-filter: blur(8px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent);
      border: 1px solid rgba(88, 166, 255, 0.35);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .btn-fullscreen {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 5px 11px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .btn-fullscreen:hover {
      border-color: var(--accent);
      background: #1f2733;
    }

    .viewport-frame {
      position: relative;
      width: min(94vw, calc((84vh - 60px) * (480 / 272)));
      max-width: 1440px;
      aspect-ratio: 480 / 272;
      background: #000;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.65);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas.emscripten {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      cursor: pointer;
    }

    #status-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(13, 17, 23, 0.92);
      gap: 14px;
      z-index: 10;
      transition: opacity 0.25s ease;
    }

    #status-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(88, 166, 255, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #status-text {
      font-size: 0.88rem;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>TouchGFX Chess</span>
      <span class="badge">1440×816 HiDPI WASM</span>
    </div>
    <div class="controls">
      <span>480×272 Logical • SDL2 + WebGL</span>
      <button class="btn-fullscreen" id="fullscreen-btn" type="button">Fullscreen</button>
    </div>
  </header>

  <div class="viewport-frame" id="viewport-frame">
    <div id="status-overlay">
      <div class="spinner" id="spinner"></div>
      <div id="status-text">Loading WebAssembly &amp; high-DPI assets...</div>
    </div>
    <canvas class="emscripten" id="canvas" width="1440" height="816" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  </div>

  <script>
    var statusOverlay = document.getElementById('status-overlay');
    var statusText = document.getElementById('status-text');
    var spinner = document.getElementById('spinner');

    document.getElementById('fullscreen-btn').addEventListener('click', function () {
      var frame = document.getElementById('viewport-frame');
      if (!document.fullscreenElement) {
        if (frame.requestFullscreen) frame.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    });

    var Module = {
      preRun: [],
      postRun: [],
      canvas: (function () {
        var canvas = document.getElementById('canvas');
        canvas.addEventListener('webglcontextlost', function (e) {
          alert('WebGL context lost. Please reload the page.');
          e.preventDefault();
        }, false);
        return canvas;
      })(),
      setStatus: function (text) {
        if (!text) {
          statusOverlay.classList.add('hidden');
          return;
        }
        statusText.textContent = text;
      },
      totalDependencies: 0,
      monitorRunDependencies: function (left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        if (left) {
          Module.setStatus('Loading assets... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')');
        } else {
          Module.setStatus('');
        }
      }
    };

    window.onerror = function (msg) {
      statusText.textContent = 'Error: ' + msg;
      spinner.style.display = 'none';
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
